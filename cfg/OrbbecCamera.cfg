#!/usr/bin/env python

PACKAGE = 'orbbec_camera'

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Badger: provide legacy interface for disabling the emitter. It would take a
# bit of work to hunt down the various places that either disable the emitter
# or need to know its state and figure out how to rearchitect them. In at least
# one place, the code is relying on the dynamic reconfigure parameter update
# topic to get changes to the emitter state. One way to rearchitect would be to
# use resource manager to send state changes and have it manage tracking the
# state of the emitter.
gen.add("disable_emitter", bool_t, 0, "Disable laser emitter", False)

# Badger: Allow setting of IR stream settings using dynamic reconfigure
# The Gain/Exposure settings will not be applied if the auto-exposure config
# is enabled,
gen.add("ir_auto_exposure", bool_t, 0, "Enable/disable IR auto exposure", True)
gen.add("ir_gain", int_t, 0, "IR Gain setting", 0, 0, 15000)
gen.add("ir_exposure", int_t, 0, "IR Exposure setting", 0, 0, 10000)

exit(gen.generate(PACKAGE, "orbbec_camera", "OrbbecCamera"))
