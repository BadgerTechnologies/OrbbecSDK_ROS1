#!/usr/bin/env python

PACKAGE = 'orbbec_camera'

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Badger: provide legacy interface for disabling the emitter. It would take a
# bit of work to hunt down the various places that either disable the emitter
# or need to know its state and figure out how to rearchitect them. In at least
# one place, the code is relying on the dynamic reconfigure parameter update
# topic to get changes to the emitter state. One way to rearchitect would be to
# use resource manager to send state changes and have it manage tracking the
# state of the emitter.
gen.add("disable_emitter", bool_t, 0, "Disable laser emitter", False)

# Badger: Allow setting of IR stream settings using dynamic reconfigure
# The Gain/Exposure settings will not be applied if the auto-exposure config
# is enabled,
gen.add("ir_auto_exposure", bool_t, 0, "Enable/disable IR auto exposure", True)
gen.add("ir_gain", int_t, 0, "IR Gain setting", 0, 0, 15000)
gen.add("ir_exposure", int_t, 0, "IR Exposure setting", 0, 0, 10000)

# Badger: Make the noise removal filter dynamically reconfigurable to aid in testing
grp_noise = gen.add_group("Noise Removal Filter", type="tab")
grp_noise.add("enable_noise_removal_filter", bool_t, 0, "Enable/disable the noise removal filter", True)
grp_noise.add("noise_min_diff", int_t, 0, "Spatial filtering range in depth", 400, 1, 10000)
grp_noise.add("noise_max_size", int_t, 0, "Max size of noise pixels to remove", 240, 1, 1000)

# Badger: Make the temporal filter dynamically reconfigurable to aid in testing
grp_temporal = gen.add_group("Temporal Filter", type="tab")
grp_temporal.add("enable_temporal_filter", bool_t, 0, "Enable/disable the temporal filter", False)
grp_temporal.add("temporal_diff_threshold", double_t, 0, "Max inter-frame difference for static pixels", 0.1, 0.1, 1.0)
grp_temporal.add("temporal_weight", double_t, 0, "Weighting applied to the current frame", 0.4, 0.1, 1.0)

# Badger: Make the spatial filter dynamically reconfigurable to aid in testing
grp_spatial = gen.add_group("Spatial Filter", type="tab")
grp_spatial.add("enable_spatial_filter", bool_t, 0, "Enable/disable the spatial filter", True)
grp_spatial.add("spatial_alpha", double_t, 0, "Weighting for current pixel value", 0.5, 0.1, 1.0)
grp_spatial.add("spatial_diff_threshold", int_t, 0, "Threshold for non-edge transitions", 100, 1, 10000)
grp_spatial.add("spatial_magnitude", int_t, 0, "How many times to itterate over the frame", 2, 1, 5)
grp_spatial.add("spatial_radius", int_t, 0, "Max radius of holes to be filled", 1, 0, 8)

exit(gen.generate(PACKAGE, "orbbec_camera", "OrbbecCamera"))
